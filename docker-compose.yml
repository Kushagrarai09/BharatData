services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bharatdata
      POSTGRES_USER: bharatdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bharatdata_dev_only}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatdata -d bharatdata"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://bharatdata:${POSTGRES_PASSWORD:-bharatdata_dev_only}@db:5432/bharatdata}
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes: ["./backend:/app"]

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]

volumes:
  postgres_data:
